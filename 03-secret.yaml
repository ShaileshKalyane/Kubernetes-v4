##############################################################################
# Secrets - Store sensitive data (base64 encoded)
##############################################################################

# Opaque Secret (generic key-value)
apiVersion: v1
kind: Secret
metadata:
  name: knote-secret
  namespace: knote-app
  labels:
    app: knote
type: Opaque
data:
  # base64 encoded values (echo -n "value" | base64)
  DB_PASSWORD: cGFzc3dvcmQxMjM=        # password123
  API_KEY: bXktc2VjcmV0LWFwaS1rZXk=    # my-secret-api-key
  JWT_SECRET: and0LXN1cGVyLXNlY3JldA== # jwt-super-secret

---
# Docker Registry Secret (for pulling private images)
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry-secret
  namespace: knote-app
type: kubernetes.io/dockerconfigjson
data:
  # Replace with your actual docker config
  .dockerconfigjson: eyJhdXRocyI6eyJodHRwczovL2luZGV4LmRvY2tlci5pby92MS8iOnsidXNlcm5hbWUiOiJ1c2VyIiwicGFzc3dvcmQiOiJwYXNzIiwiYXV0aCI6ImRYTmxjanB3WVhOeiJ9fX0=

---
# TLS Secret (for HTTPS)
apiVersion: v1
kind: Secret
metadata:
  name: knote-tls-secret
  namespace: knote-app
type: kubernetes.io/tls
data:
  # Replace with actual base64-encoded cert and key
  tls.crt: LS0tLS1CRUdJTi... # placeholder
  tls.key: LS0tLS1CRUdJTi... # placeholder
