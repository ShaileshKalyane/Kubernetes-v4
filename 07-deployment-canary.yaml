##############################################################################
# Deployment - CANARY Strategy (gradual traffic shifting)
#
# How it works:
#   1. Stable deployment runs with most replicas (e.g., 9)
#   2. Canary deployment runs with few replicas (e.g., 1)
#   3. Both share the SAME label so the Service sends ~10% to canary
#   4. Monitor metrics, then scale up canary & scale down stable
#   - Best for: testing new versions with a small % of real traffic
##############################################################################

# --- Stable Deployment (90% traffic) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knote-stable
  namespace: knote-app
  labels:
    app: knote-canary
    track: stable
spec:
  replicas: 9           # 9 out of 10 = 90% of traffic
  selector:
    matchLabels:
      app: knote-canary
      track: stable
  template:
    metadata:
      labels:
        app: knote-canary    # Same label as canary -> service routes to both
        track: stable
    spec:
      containers:
        - name: knote
          image: andalike/node8080     # current stable version
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: knote-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          imagePullPolicy: Always

---
# --- Canary Deployment (10% traffic) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knote-canary
  namespace: knote-app
  labels:
    app: knote-canary
    track: canary
spec:
  replicas: 1           # 1 out of 10 = ~10% of traffic
  selector:
    matchLabels:
      app: knote-canary
      track: canary
  template:
    metadata:
      labels:
        app: knote-canary    # Same label as stable -> service routes to both
        track: canary
    spec:
      containers:
        - name: knote
          image: andalike/node8080     # new version to test
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: knote-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          imagePullPolicy: Always

---
# --- Service routes to BOTH stable + canary (based on shared label) ---
apiVersion: v1
kind: Service
metadata:
  name: knote-canary-svc
  namespace: knote-app
spec:
  selector:
    app: knote-canary    # Matches both stable AND canary pods
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
